<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- b1: Top-left character (square) -->
        <div class="box box-1">
            <img src="./Assets/clear_transparent_10.png" alt="Character">
        </div>
        
        <!-- b2: BUTUSIC text card (tall) -->
        <div class="box box-2">
            <img src="./Assets/clear_transparent_9.png" alt="Butusic">
        </div>
        
        <!-- b3: Circle "more cases" (square) -->
        <div class="box box-3">
            <img src="./Assets/clear_transparent_1.png" alt="More Cases">
        </div>
        
        <!-- b4: Exhibition info (wide) -->
        <div class="box box-4">
            <img src="./Assets/clear_transparent_2.png" alt="Exhibition">
        </div>
        
        <!-- b5: Ribbons & QR (square) -->
        <div class="box box-5">
            <img src="./Assets/clear_transparent_3.png" alt="Ribbons">
        </div>
        
        <!-- b6: Menu list (tall) -->
        <div class="box box-6">
            <img src="./Assets/clear_transparent_4.png" alt="Menu">
        </div>
        
        <!-- b7: White authors box (wide) -->
        <div class="box box-7">
            <img src="./Assets/clear_transparent_5.png" alt="Best Authors">
        </div>
        
        <!-- b8: Blue character (tall) -->
        <div class="box box-8">
            <img src="./Assets/clear_transparent_7.png" alt="Blue Character">
        </div>
        
        <!-- b9: Purple smiley bar (wide/short) -->
        <div class="box box-9">
            <img src="./Assets/clear_transparent_8.png" alt="Purple Smiley">
        </div>
    </div>

</body>
</html>
