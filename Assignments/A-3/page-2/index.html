<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game Landing</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-shell">
        <div class="bg-gradient"></div>
        <div class="bg-fade-left"></div>
        <div class="bg-word game-word">GAME</div>
        <div class="bg-word squid-word">SQUID</div>

        <header class="header">
            <div class="brand-mark">
                <img src="card3.png" alt="Squid Game mini mark" class="brand-mini-image">
                <div class="brand-text">
                    <span>SQUID</span>
                    <span>GAME</span>
                </div>
            </div>

            <nav class="nav-links">
            <a href="#">About</a>
            <a href="#" class="active">Watch now</a>
            <a href="#">Actors</a>
            <a href="#">Contact</a>
            </nav>

            <button class="menu-btn" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </header>

        <main class="hero-area">
            <section class="left-panel">
                <div class="title-art">
                    <div class="row row-1">
                        <span>SQUID</span>
                        <i class="dot cyan"></i>
                    </div>
                    <div class="row row-2">
                        <span>GAME</span>
                    </div>
                    <i class="dot yellow"></i>
                </div>

                <p class="description">
                    Action / Thriller / Drama Series directed by Dong-hyuk Hwang<br>
                    Season 1: 9 Episodes
                </p>

                <div class="action-buttons">
                    <button class="btn btn-primary">
                        <span class="btn-icon">&#9654;</span>
                        Play Now
                    </button>
                    <button class="btn btn-secondary">
                        <span class="btn-icon">&#9655;</span>
                        Watch Trailer
                    </button>
                </div>
            </section>

            <div class="center-scroll">
                <span class="scroll-text">SCROLL</span>
                <span class="scroll-line"></span>
            </div>

            <section class="right-panel">
                <img src="image-removebg-preview.png" alt="Masked guard cutout" class="hero-image">
            </section>

            <aside class="social-side" aria-label="Social links">
                <a href="#" class="social-icon">t</a>
                <a href="#" class="social-icon">ig</a>
                <a href="#" class="social-icon">f</a>
            </aside>
        </main>

        <section class="cards-wrap">
            <div class="cards-track">
                <article class="card">
                    <img src="card1.png" alt="Squid game scene one">
                    <button class="play-icon" aria-label="Play video">&#9654;</button>
                </article>

                <article class="card">
                    <img src="card2.png" alt="Squid game scene two">
                    <button class="play-icon" aria-label="Play video">&#9654;</button>
                </article>

                <article class="card">
                    <img src="card3.png" alt="Squid game scene three">
                    <button class="play-icon" aria-label="Play video">&#9654;</button>
                </article>
            </div>
        </section>
    </div>
</body>
</html>
