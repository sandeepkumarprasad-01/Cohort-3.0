<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleX - Insights & Blogs</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <svg class="logo-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- A simple placeholder logo resembling the ScaleX icon -->
                <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="white"/>
            </svg>
            ScaleX
        </div>
        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Blogs</a>
            <a href="#">Contact Us</a>
        </nav>
        <div class="nav-button">
            <button class="btn-get-started">Get Started</button>
        </div>
    </header>

    <main class="main-content">
        <h1 class="page-title">Insights & Blogs</h1>

        <div class="filters">
            <button class="filter-btn active">All</button>
            <button class="filter-btn">Tech</button>
            <button class="filter-btn">SaaS</button>
            <button class="filter-btn">Marketing</button>
        </div>

        <section class="card-grid">
            <article class="card">
                <div class="card-image-wrapper">
                    <img src="assets/card1.png" alt="SaaS Marketing" class="card-image">
                </div>
                <div class="card-content">
                    <span class="card-tag">Tech</span>
                    <h2 class="card-title">The Ultimate Guide To<br>SaaS Marketing</h2>
                    <p class="card-date">May 23, 2025</p>
                </div>
            </article>

            <article class="card">
                <div class="card-image-wrapper">
                    <img src="assets/card2.png" alt="SaaS Growth" class="card-image">
                </div>
                <div class="card-content">
                    <span class="card-tag">SaaS</span>
                    <h2 class="card-title">5 Key Trends In SaaS<br>Growth For 2025</h2>
                    <p class="card-date">May 23, 2025</p>
                </div>
            </article>

            <article class="card">
                <div class="card-image-wrapper">
                    <img src="assets/card3.png" alt="Data-Driven Strategies" class="card-image">
                </div>
                <div class="card-content">
                    <span class="card-tag">Marketing</span>
                    <h2 class="card-title">How Data-Driven<br>Strategies Are Important</h2>
                    <p class="card-date">May 23, 2025</p>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
